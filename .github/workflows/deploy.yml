name: Deploy to Hetzner

# Build the image in CI, push it to GHCR, then have the server pull it. The server
# never holds the source tree and never builds anything, so a deploy is a pull and a
# restart — fast, and identical to whatever CI tested.
#
# Setup instructions: docs/hetzner-deployment.md

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Cancelling a run mid-flight could leave the server between
# states, so a queued run waits for the current one instead of replacing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # settings_test seeds its own throwaway attestation config and swaps in
      # in-memory SQLite, so this needs neither a database nor any secret.
      - name: Run the suite
        run: python manage.py test ApiApp --settings=ApiCore.settings_test

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase image names and this repository has them, so the
      # owner/repo pair cannot be used verbatim.
      - name: Compute image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Hetzner CX/CPX servers are x86; CAX servers are ARM. An image built for
          # the wrong one fails at start with "exec format error". Override with a
          # BUILD_PLATFORM repository variable of linux/arm64 for CAX.
          platforms: ${{ vars.BUILD_PLATFORM || 'linux/amd64' }}
          push: true
          # Tagged by commit so a rollback names an exact build, not "the one before".
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Lets you attach required reviewers or a branch restriction in the repository's
    # environment settings. GitHub creates the environment on first run.
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/pluto-notifications' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinning the host key is what makes this safe. The alternative,
          # StrictHostKeyChecking=no, accepts whatever answers on that address and
          # would hand the deploy key to an impostor.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify the pinned host key
        # "Host key verification failed" from scp cannot say which of three problems
        # it is; this step can. It separates an empty or invisible secret, a value
        # that is not a known_hosts line, an entry whose host field does not match
        # SSH_HOST, and a pinned key the server no longer presents. Fingerprints are
        # public, so printing them leaks nothing.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::SSH_KNOWN_HOSTS is empty or not visible to this job. It must be a repository secret or a secret in the 'production' environment."
            exit 1
          fi

          echo "Pinned in known_hosts:"
          if ! ssh-keygen -l -f ~/.ssh/known_hosts; then
            echo "::error::SSH_KNOWN_HOSTS is not a valid known_hosts line. Use the full ssh-keyscan output — it starts with the host, not with ssh-ed25519."
            exit 1
          fi

          echo "Presented by the server right now:"
          ssh-keyscan -t ed25519 "$SSH_HOST" 2>/dev/null | ssh-keygen -l -f - || echo "(could not reach the server to scan)"

          if ! ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::No known_hosts entry matches SSH_HOST. The first field of the SSH_KNOWN_HOSTS line must be exactly the SSH_HOST value — an IP and a hostname do not match each other."
            exit 1
          fi

          echo "known_hosts has an entry for SSH_HOST. If the fingerprints above differ, the pinned key is stale — re-run ssh-keyscan and update the secret."

      - name: Ship configuration and secrets
        # Optional alternative to the hand-provisioned flow in docs section 3: when an
        # ENV_FILE secret exists, it is the source of truth and both files are
        # rewritten on every deploy — hand edits on the server will not survive.
        # Values pass through env vars rather than ${{ }} inside the script so their
        # content cannot inject into the shell, and go over stdin so they never touch
        # the runner's disk or process list.
        if: ${{ secrets.ENV_FILE != '' }}
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # 711, not 700: the api container traverses this directory as UID 10001,
          # not as the deploy user.
          ssh "$TARGET" "install -d -m 711 '$DEPLOY_PATH/secrets'"
          printf '%s\n' "$ENV_FILE" | ssh "$TARGET" "umask 077 && cat > '$DEPLOY_PATH/.env'"
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            # rm before writing: after a previous deploy the file belongs to UID
            # 10001, which a non-root deploy user can replace but not write into.
            printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT" \
              | ssh "$TARGET" "umask 077 && rm -f '$DEPLOY_PATH/secrets/firebase-service-account.json' && cat > '$DEPLOY_PATH/secrets/firebase-service-account.json'"
            # The container reads the file as UID 10001; a 600 file owned by the
            # deploy user is unreadable there. Plain chown needs root — the docker
            # fallback covers a non-root deploy user, which can always do this
            # because deploying already requires docker.
            ssh "$TARGET" "chown 10001 '$DEPLOY_PATH/secrets/firebase-service-account.json' 2>/dev/null \
              || docker run --rm -v '$DEPLOY_PATH/secrets:/s' alpine:3 chown 10001 /s/firebase-service-account.json"
          else
            echo "FIREBASE_SERVICE_ACCOUNT secret not set — leaving the server's copy untouched"
          fi

      - name: Ship the compose definition
        # Sent every deploy, so the server's stack definition always matches the
        # commit being deployed rather than drifting from whatever was set up by hand.
        run: scp docker-compose.prod.yml "$TARGET:$DEPLOY_PATH/docker-compose.yml"

      - name: Authenticate the server to GHCR
        # Piped over stdin so the token never appears in the remote process list.
        # GITHUB_TOKEN is scoped to this run and expires with it, so no long-lived
        # registry credential is stored on the server.
        run: |
          ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin" \
            <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Pull and restart
        run: |
          ssh "$TARGET" "API_IMAGE='$IMAGE' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # A record of what is running, for humans and for rollback.
          echo "$API_IMAGE" > current-image.txt

          docker compose pull
          docker compose up -d --remove-orphans
          REMOTE

      - name: Wait for the container to report healthy
        # The deploy is not finished when `up -d` returns — that only means the
        # container was created. Migrations run at startup and can fail, so wait for
        # the healthcheck rather than assuming success. API_IMAGE is needed because
        # compose interpolates the file for every command, even `ps`.
        run: |
          ssh "$TARGET" "API_IMAGE='$IMAGE' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          container=$(docker compose ps -q api)

          # start-period is 20s and the interval 30s, so the first verdict can take
          # about a minute. 40 tries at 5s leaves room for a slow migration.
          for _ in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || echo unknown)
            case "$status" in
              healthy)   echo "api is healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 5
          done

          echo "::error::api did not become healthy"
          docker compose ps
          docker compose logs --tail=150 api
          exit 1
          REMOTE

      - name: Clean up the server
        if: always()
        # Dangling layers accumulate with every deploy and Hetzner disks are small.
        # Only untagged images go: previous releases stay pullable for rollback.
        run: |
          ssh "$TARGET" 'docker image prune -f >/dev/null; docker logout ghcr.io >/dev/null' || true
